[workspace]
name = "radiance-codec"
version = "0.0.1"
description = "Float32 HDR image compression research codec"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = ">=3.11,<3.13"
libjxl-tools = "*"
openimageio = "*"
py-openimageio = "*"
openexr = "*"
zstd = "*"
xz = "*"
bzip2 = "*"
lz4-c = "*"
zfpy = "*"
python-blosc = "*"
numpy = "*"
imageio = "*"
requests = "*"
tqdm = "*"
tabulate = "*"
scipy = "*"
cmake = "*"
ninja = "*"
cxx-compiler = "*"
pytorch = "*"
einops = "*"

[pypi-dependencies]
constriction = "*"

[tasks]
build = { cmd = "cmake -G Ninja -S codec -B codec/build -DCMAKE_BUILD_TYPE=Release && cmake --build codec/build", description = "Build the C++ codec library" }
install-cmake-local = { cmd = "cmake --install codec/build --prefix dist/radiance_codec", depends-on = ["build"], description = "Install C/C++ headers, library, and CMake package config into dist/radiance_codec" }
wheel = { cmd = "python -m pip wheel . --no-deps -w dist", description = "Build a Python wheel containing radiance_codec.py and the native shared library" }
install-python = { cmd = "python -m pip install .", description = "Install the Python package and native shared library into the active environment" }
install-python-editable = { cmd = "python -m pip install -e .", depends-on = ["build"], description = "Install the Python binding in editable mode using codec/build for the native library" }
test-codec = { cmd = "codec/build/test_codec", depends-on = ["build"] }
ml-fetch  = "python ml/fetch_extra_data.py"
ml-prep   = "python ml/prepare_training_data.py"
ml-train  = "python ml/train.py"
ml-eval   = "python ml/evaluate.py"
ml-rans   = "python ml/ml_rans_compress.py"
ml-hybrid = "python ml/report_hybrid.py"
ml-check-mps = "python ml/check_mps.py"
ml-test-hierarchy = "python ml/test_hdr_hierarchy.py"
ml-audit-fields = "python scripts/analyze_float_fields.py"
ml-audit-structural = "python scripts/analyze_structural_predictors.py"
ml-estimate-structural = "python scripts/evaluate_structural_hybrid.py"
ml-estimate-structural-adaptive = "python scripts/evaluate_structural_adaptive.py"
ml-estimate-structural-spatial-context = "python scripts/evaluate_structural_spatial_context.py"
ml-estimate-structural-delta-context = "python scripts/evaluate_structural_delta_context.py"
