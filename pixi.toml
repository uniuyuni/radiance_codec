ml-estimate-structural-delta-sidecarry = "python scripts/evaluate_structural_delta_sidecarry.py"
ml-estimate-structural-delta-lowfield = "python scripts/evaluate_structural_delta_lowfield.py"
ml-estimate-structural-delta-payload = "python scripts/evaluate_structural_delta_payload.py"
ml-estimate-structural-delta-grouped = "python scripts/evaluate_structural_delta_grouped.py"
ml-estimate-float-aligned-delta = "python scripts/evaluate_float_aligned_delta.py"
ml-rans-structural-probe = "python scripts/structural_rans_probe.py"
ml-rans-delta-field = "python scripts/structural_delta_field_roundtrip.py"
ml-rans-delta-grouped = "python scripts/structural_delta_grouped_roundtrip.py"
ml-rans-delta-grouped-rans = "python scripts/structural_delta_grouped_rans_roundtrip.py"
ml-rans-delta-field-rans = "python scripts/structural_delta_field_rans_roundtrip.py"
ml-rans-spatial-context = "python scripts/structural_spatial_rans_roundtrip.py"
bench-structural-context-cpp = "python scripts/benchmark_structural_context_cpp.py"
